<!DOCTYPE html>
<html>
<head>
    <title>Preview Extracted Questions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }
        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>PDF Extracted Questions Preview</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% else %}
        <p>Detected Questions: {{ question_count }}</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Save All Questions</button>
        </form>
    {% endif %}

    <br>
    <a href="{% url 'pyq:upload' %}">Back to Uploads</a>
</div>
</body>
</html>
