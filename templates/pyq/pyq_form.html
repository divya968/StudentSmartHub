<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ heading|default:"Add PYQ" }} | Student Smart Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/dashboard/">Student Smart Hub</a>
    <a href="{% url 'pyq:list' %}" class="btn btn-outline-light btn-sm">Back to PYQs</a>
</nav>

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 750px;">
        <div class="card-body p-4">

            <h2 class="mb-2">
                {{ heading|default:"Add Previous Year Question" }}
            </h2>

            <p class="text-muted mb-4">
                Save or update a question for exam preparation.
            </p>

            <form method="POST">
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}

                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary">
                    {% if heading == "Edit PYQ Question" %}
                        Update Question
                    {% else %}
                        Save Question
                    {% endif %}
                </button>

                <a href="{% url 'pyq:list' %}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>

        </div>
    </div>
</div>

<style>
input, textarea, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ced4da;
    border-radius: 6px;
}
</style>

</body>
</html>
