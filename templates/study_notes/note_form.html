<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ heading }} | Student Smart Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .navbar { background: #172554; }
        .card { border: none; border-radius: 14px; }
    </style>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body>
{% include "partials/sidebar.html" %}

<nav class="navbar navbar-dark px-4 py-3">
    <a class="navbar-brand fw-bold" href="/dashboard/">Student Smart Hub</a>
    <a href="{% url 'study_notes:list' %}" class="btn btn-outline-light btn-sm">My Notes</a>
</nav>

<div class="container py-5" style="max-width:800px;">
    <div class="card shadow-sm p-4">
        <h2 class="mb-4">{{ heading }}</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="note-toolbar no-print" id="mdBar">
                <button type="button" data-md="**|**" title="Bold"><b>B</b></button>
                <button type="button" data-md="*|*" title="Italic"><i>I</i></button>
                <button type="button" data-md="# |" data-line="1" title="Heading">H</button>
                <button type="button" data-md="- |" data-line="1" title="Bullet list">• List</button>
                <button type="button" data-md="1. |" data-line="1" title="Numbered list">1. List</button>
                <button type="button" data-md="`|`" title="Code">&lt;/&gt;</button>
            </div>
            {{ form.as_p }}

            {% if form.instance.attachment %}
                <div class="alert alert-info">
                    **Existing Attachment:**
                    <a href="{{ form.instance.attachment.url }}" target="_blank">
                        {{ form.instance.attachment.name }}
                    </a>
                </div>
            {% endif %}

            <p class="text-muted small">
                Allowed files: PDF, DOCX, TXT | Maximum size: 10 MB
            </p>

            <button type="submit" class="btn btn-primary">Save Note</button>
            <a href="{% url 'study_notes:list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<script>
document.getElementById("mdBar").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var ta = document.getElementById("noteContent"); if (!ta) return;
    var parts = b.dataset.md.split("|"), start = ta.selectionStart, end = ta.selectionEnd, v = ta.value;
    if (b.dataset.line) {
        var ls = v.lastIndexOf("\n", start - 1) + 1;
        ta.value = v.slice(0, ls) + parts[0] + v.slice(ls);
        ta.selectionStart = ta.selectionEnd = start + parts[0].length;
    } else {
        ta.value = v.slice(0, start) + parts[0] + v.slice(start, end) + parts[1] + v.slice(end);
        ta.selectionStart = start + parts[0].length; ta.selectionEnd = end + parts[0].length;
    }
    ta.focus();
});
</script>
</body>
</html>
