<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ heading }} | Student Smart Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .navbar { background: #172554; }
        .card { border: none; border-radius: 14px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
    <a class="navbar-brand fw-bold" href="/dashboard/">Student Smart Hub</a>
    <a href="{% url 'study_notes:list' %}" class="btn btn-outline-light btn-sm">My Notes</a>
</nav>

<div class="container py-5" style="max-width:800px;">
    <div class="card shadow-sm p-4">
        <h2 class="mb-4">{{ heading }}</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            {% if form.instance.attachment %}
                <div class="alert alert-info">
                    **Existing Attachment:**
                    <a href="{{ form.instance.attachment.url }}" target="_blank">
                        {{ form.instance.attachment.name }}
                    </a>
                </div>
            {% endif %}

            <p class="text-muted small">
                Allowed files: PDF, DOCX, TXT | Maximum size: 10 MB
            </p>

            <button type="submit" class="btn btn-primary">Save Note</button>
            <a href="{% url 'study_notes:list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
