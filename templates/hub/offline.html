
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline | Student Smart Hub</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #252044;
            text-align: center;
        }

        .offline-card {
            max-width: 460px;
            width: 100%;
            padding: 40px 25px;
            background: white;
            border: 1px solid #e5defe;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(80, 50, 150, 0.10);
        }

        .offline-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 12px;
            color: #6d45c5;
        }

        p {
            line-height: 1.7;
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 24px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            Student Smart Hub cannot connect to the internet right now.
            Please check your connection and try again.
        </p>
        <a href="/">Try Again</a>
    </main>
</body>
</html>
